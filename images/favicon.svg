<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Code brackets / Mobile device stylized icon -->
  <!-- Left bracket < -->
  <path d="M44 42 L24 64 L44 86" fill="none" stroke="url(#accentGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right bracket > -->
  <path d="M84 42 L104 64 L84 86" fill="none" stroke="url(#accentGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized N in center -->
  <path d="M52 82 L52 46 L76 82 L76 46" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
